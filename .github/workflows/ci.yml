name: CI - Compilación y pruebas

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar el proyecto y ejecutar las pruebas
        run: ./mvnw -B -ntp clean verify

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 15

      - name: Resumen del resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Construcción exitosa: el proyecto compila y todas las pruebas pasan."
          else
            echo "❌ La construcción falló. Revisar los reportes publicados."
          fi

  containers:
    name: Pruebas con PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas que requieren Docker
        run: ./mvnw -B -ntp -Dgroups=containers -DexcludedGroups=ninguno verify

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-containers
          path: target/surefire-reports/
          retention-days: 15
