services:
  postgres:
    image: postgres:17-alpine
    container_name: ventas-postgres
    environment:
      POSTGRES_DB: ventasdb
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ventas123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas -d ventasdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ventas-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ventasdb
      DB_USER: ventas
      DB_PASSWORD: ventas123
      APP_API_KEY: grupo9-2026
    ports:
      - "8080:8080"

volumes:
  postgres_data:
