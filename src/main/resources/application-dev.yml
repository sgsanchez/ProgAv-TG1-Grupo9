# Perfil de desarrollo local: base de datos H2 persistente en disco.
# Permite trabajar sin Docker; la base de datos real del proyecto es PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:file:./data/ventasdb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    # Ejecuta db/seed.sql después de que Hibernate cree el esquema
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed.sql

logging:
  level:
    ec.edu.espe.ventas: DEBUG
