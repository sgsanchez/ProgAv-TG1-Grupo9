# Perfil de pruebas automáticas: H2 en memoria, se destruye al finalizar.
spring:
  datasource:
    url: jdbc:h2:mem:ventas_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

app:
  security:
    api-key: test-api-key
  ventas:
    iva: 0.15

logging:
  level:
    root: WARN
    ec.edu.espe.ventas: INFO
